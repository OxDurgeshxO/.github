name: Reusable Node & TypeScript Workflow

on:
  workflow_call:
    inputs:
      node-versions:
        description: "JSON array of Node versions to test"
        required: false
        default: '["20", "22"]'
        type: string
      package-manager:
        description: "Package manager (pnpm | npm)"
        required: false
        default: "pnpm"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }} Matrix Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm (if required)
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ inputs.package-manager }}

      - name: Install Dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Typecheck
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec tsc --noEmit
          else
            npx tsc --noEmit
          fi

      - name: Test
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm test
          else
            npm test
          fi
