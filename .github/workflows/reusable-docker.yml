name: Reusable Docker Build & Scan Workflow

on:
  workflow_call:
    inputs:
      image-name:
        description: "Name of the Docker image (without registry prefix)"
        required: true
        type: string
      dockerfile-path:
        description: "Path to Dockerfile"
        required: false
        default: "./Dockerfile"
        type: string
      context-path:
        description: "Build context directory"
        required: false
        default: "."
        type: string
      push-to-ghcr:
        description: "Whether to push image to GHCR"
        required: false
        default: false
        type: boolean
    outputs:
      image-tag:
        description: "Generated image tag"
        value: ${{ jobs.build-and-scan.outputs.image-tag }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Login to GitHub Container Registry
        if: inputs.push-to-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context-path }}
          file: ${{ inputs.dockerfile-path }}
          push: ${{ inputs.push-to-ghcr }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ !inputs.push-to-ghcr }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.push-to-ghcr && steps.meta.outputs.tags || 'local-build' }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true
