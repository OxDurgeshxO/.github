name: Reusable Performance & Benchmark Workflow

on:
  workflow_call:
    inputs:
      benchmark-command:
        description: "Command to execute performance benchmarks"
        required: false
        default: "pnpm run benchmark"
        type: string
      output-file:
        description: "Benchmark JSON output path"
        required: false
        default: "benchmark-results.json"
        type: string
      threshold-percent:
        description: "Max tolerable performance regression percentage"
        required: false
        default: 15
        type: number

permissions:
  contents: read

jobs:
  performance:
    name: Benchmark & Regression Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || npm ci

      - name: Build Code
        run: pnpm run build --if-present || npm run build --if-present

      - name: Execute Benchmark Suite
        run: ${{ inputs.benchmark-command }}

      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ${{ inputs.output-file }}
          if-no-files-found: ignore
